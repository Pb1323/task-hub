<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
*{box-sizing:border-box;margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
html,body{background:transparent;overflow:hidden}
.b{height:100vh;margin:0;border-radius:28px;display:flex;align-items:center;gap:12px;padding:12px 16px;
 background:rgba(255,255,255,.94);color:#10332a;border:1px solid rgba(16,51,42,.12)}
@media (prefers-color-scheme:dark){.b{background:rgba(32,34,40,.95);color:#f2f5f4;border-color:rgba(255,255,255,.12)}}
.i{width:44px;height:44px;border-radius:12px;background:#00a878;display:grid;place-items:center;font-size:22px;flex:none}
.t{flex:1;min-width:0}.t b{font-size:15px;display:block}.t span{font-size:13px;opacity:.7}
.a{display:flex;gap:6px}
button{border:0;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;background:#00a878;color:#fff}
button.g{background:rgba(127,127,127,.2);color:inherit}
</style></head><body>
<div class="b"><div class="i" id="i"></div><div class="t"><b id="t"></b><span id="d"></span></div><div class="a" id="a"></div></div>
<script src="banner.js"></script>
</body></html>
