<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="g-check-circle" viewBox="0 0 24 24"><path d="M7.8 12.1 10.6 14.9 16.5 8.9 M21 12a9 9 0 1 1-18 0 9 9 0 1 1 18 0" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="g-clock" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 1 1 18 0M12 6v6l4 2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="g-claude" viewBox="0 0 24 24"><path d="M12.00 9.40 L12.00 2.40 M13.30 9.75 L15.50 5.94 M14.25 10.70 L20.31 7.20 M14.60 12.00 L19.00 12.00 M14.25 13.30 L20.31 16.80 M13.30 14.25 L15.50 18.06 M12.00 14.60 L12.00 21.60 M10.70 14.25 L8.50 18.06 M9.75 13.30 L3.69 16.80 M9.40 12.00 L5.00 12.00 M9.75 10.70 L3.69 7.20 M10.70 9.75 L8.50 5.94" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol></defs></svg>

</div>
