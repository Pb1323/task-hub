<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>task-hub</title>
<link rel="stylesheet" href="style.css">
</head><body>
<main id="hub" class="collapsed">
  <!-- collapsed strip -->
  <div class="strip">
    <button class="sq" id="sExpand" title="Open task-hub" aria-label="Open task-hub">&#10003;<span class="badge" id="sBadge"></span></button>
    <div class="sTimer" id="sTimer"></div>
    <button class="sq" data-link="https://claude.ai" title="Claude">&#10022;</button>
    <div class="sRings" id="sRings"></div>
  </div>

  <!-- full panel -->
  <div class="full">
    <header>
      <div>
        <div class="eyebrow" id="date"></div>
        <h1 id="greet"></h1>
      </div>
      <div class="tools">
        <button class="ib" id="bGear" title="Settings" aria-label="Settings">&#9881;</button>
        <button class="ib" id="bPin" title="Keep open" aria-label="Keep sidebar open">&#128204;</button>
        <button class="ib" id="bCollapse" title="Collapse" aria-label="Collapse sidebar">&#10095;</button>
      </div>
    </header>

    <section class="card" id="settings" hidden>
      <div class="h">Settings</div>
      <label class="set"><span>Launch at Windows startup</span><input type="checkbox" id="oAuto"></label>
      <label class="set"><span>Health reminders</span><input type="checkbox" id="oNudge"></label>
      <div class="set"><span>Remind every (min)</span>
        <span class="mins">
          <label>&#128167;<input type="number" min="5" max="240" id="nWater"></label>
          <label>&#128694;<input type="number" min="5" max="240" id="nWalk"></label>
          <label>&#129496;<input type="number" min="5" max="240" id="nStretch"></label>
        </span></div>
      <div class="set"><span>Quit task-hub</span><button class="pill ghost" id="bQuit">Quit</button></div>
    </section>

    <section class="card focusCard">
      <div class="h">Focus <b id="focusState"></b></div>
      <div class="timeRow">
        <div class="tring">
          <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
            <circle cx="66" cy="66" r="58" fill="none" stroke="var(--ring)" stroke-width="9"/>
            <circle id="tArc" cx="66" cy="66" r="58" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="364.4 364.4" stroke-dashoffset="364.4" transform="rotate(-90 66 66)"/>
          </svg>
          <div class="big" id="time">25:00</div>
        </div>
        <div class="ctl">
          <button class="pill" id="bStart">Start</button>
          <button class="pill ghost" id="bReset">Reset</button>
        </div>
      </div>
      <input class="field" id="goal" placeholder="Goal for this block, e.g. send 10 DMs" maxlength="120" aria-label="Goal">
      <div class="seg" id="mins">
        <button data-m="15">15</button><button data-m="25">25</button><button data-m="45">45</button><button data-m="60">60</button><button data-m="90">90</button>
      </div>
      <div class="sub" id="nextNudge"></div>
    </section>

    <section class="card">
      <div class="h">Today <b id="left"></b></div>
      <form id="addForm" class="add"><input class="field" id="addText" aria-label="New task" placeholder="Add a task" maxlength="140" autocomplete="off"><button class="pill" type="submit">Add</button></form>
      <div id="tasks"></div>
    </section>

    <section class="card">
      <div class="h">Health habits <b>tap + when done</b></div>
      <div class="rings" id="rings"></div>
    </section>

    <section class="card">
      <div class="h">Quick launch</div>
      <div class="apps" id="apps"></div>
      <button class="pill wide" id="bCode">&#9654; Open Claude Code in terminal</button>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body></html>
